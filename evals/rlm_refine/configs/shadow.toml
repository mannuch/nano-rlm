# Every OpenThoughts TBLite task with nano-rlm's auto-refinement on and the TypeSafe
# judge in shadow mode: the planner decides, the judge's verdict is only recorded.
#
#   uv run vf-eval @ configs/shadow.toml
model = "deepseek/deepseek-v4.1-flash"
num_rollouts = 1

[env.taskset]
id = "rlm-refine"

[env.agent.harness]
id = "rlm-refine"
version = "dbd42782134f6b765da7d9028c1393f9dbf8622f"
forward_env = ["TYPESAFE_API_KEY"]

[env.agent.harness.policy]
summarize_at_tokens = 25000

[env.agent.harness.harness]
auto_refine = true
refine_turn_interval = 8
refine_cooldown_seconds = 0
refine_judge = { mode = "shadow" }

[env.agent.runtime]
type = "prime"
