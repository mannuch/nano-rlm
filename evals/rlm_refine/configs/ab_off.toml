# Reward comparison, arm "off": auto-refinement off: the baseline.
# The three ab_*.toml configs differ only in [env.agent.harness.harness].
#
#   uv run vf-eval @ configs/ab_off.toml
model = "deepseek/deepseek-v4.1-flash"
num_rollouts = 3

[env.taskset]
id = "rlm-refine"

[env.agent.harness]
id = "rlm-refine"
version = "4dacd2b1de2765ea775255d6712464234da06790"
forward_env = ["TYPESAFE_API_KEY"]

[env.agent.harness.policy]
summarize_at_tokens = 25000

[env.agent.harness.harness]
auto_refine = false

[env.agent.runtime]
type = "prime"
