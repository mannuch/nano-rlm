# Three OpenThoughts TBLite tasks with nano-rlm's auto-refinement on and the planner
# deciding every pass alone (`auto_refine_review = "planner"`): no judge, no TypeSafe key.
#
#   uv run vf-eval @ configs/smoke_planner.toml
model = "deepseek/deepseek-v4.1-flash"
num_rollouts = 1
num_tasks = 3

[env.taskset]
id = "rlm-refine"

[env.agent.harness]
id = "rlm-refine"
version = "bf8df3d52c9adec608b09d440198044fc5b83855"

[env.agent.harness.policy]
summarize_at_tokens = 25000

[env.agent.harness.harness]
auto_refine = true
auto_refine_review = "planner"
refine_turn_interval = 8
refine_cooldown_seconds = 0

[env.agent.runtime]
type = "prime"
