# SWE-bench Pro V2 HARD-51, arm "planner": auto-refinement on, the planner (task model) deciding every pass.
# The three swe_*.toml arms differ only in [env.agent.harness.harness].
#
#   uv run vf-eval @ configs/swe_planner.toml
model = "deepseek/deepseek-v4.1-flash"
num_rollouts = 2
num_tasks = 5
shuffle = true   # verifiers' fixed seed: the same 5 tasks in every arm, none of them in swe_smoke

[env.taskset]
id = "rlm-refine-swebench-pro"
subset = "hard51"

[env.agent.harness]
id = "rlm-refine"
version = "dbd42782134f6b765da7d9028c1393f9dbf8622f"
forward_env = ["TYPESAFE_API_KEY"]

[env.agent.harness.policy]
summarize_at_tokens = 80000
delegation_prompt = true

[env.agent.harness.harness]
auto_refine = true
auto_refine_review = "planner"   # no judge: the task model decides every pass
refine_turn_interval = 8
refine_cooldown_seconds = 0

[env.agent.runtime]
type = "prime"
