# SWE-bench Pro V2 HARD-51, arm "off": auto-refinement off: the baseline.
# The three swe_*.toml arms differ only in [env.agent.harness.harness].
#
#   uv run vf-eval @ configs/swe_off.toml
model = "deepseek/deepseek-v4.1-flash"
num_rollouts = 2
num_tasks = 5
shuffle = true   # verifiers' fixed seed: the same 5 tasks in every arm, none of them in swe_smoke

[env.taskset]
id = "rlm-refine-swebench-pro"
subset = "hard51"

[env.agent.harness]
id = "rlm-refine"
version = "110ec934e0231ed12aea909c0b985d1cadd90baa"
forward_env = ["TYPESAFE_API_KEY"]

[env.agent.harness.policy]
summarize_at_tokens = 80000
delegation_prompt = true

[env.agent.harness.harness]
auto_refine = false

[env.agent.runtime]
type = "prime"
